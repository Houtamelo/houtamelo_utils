[package]
name = "houtamelo_utils"
version = "4.0.0"
authors = ["Houtamelo"]
edition = "2024"
description = "A collection of utilities shared between Houtamelo's projects."
license = "MIT"
repository = "https://github.com/Houtamelo/houtamelo_utils"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
float-cmp = { version = "0.10.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
bimap = { version = "0.6.3", features = ["std"] }
rand = { version = "0.10.2", optional = true }
pluck = "0.1.1"
anyhow = "1.0.104"
smallvec = { version = "1.15.2", features = ["const_generics"] }

[features]
default = []
serde = ["dep:serde", "bimap/serde", "smallvec/serde"]
rand = ["dep:rand"]

[dev-dependencies]
ron = "0.12.2"